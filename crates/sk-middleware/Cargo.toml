[package]
name = "sk-middleware"
version.workspace = true
description = "OpenSSH SecurityKeyProvider middleware for the Cryptick token"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "sk_blebridge"
# dlopen'd by ssh-sk-helper. rlib as well so the logic can be unit tested.
crate-type = ["cdylib", "rlib"]

[dependencies]
ctap.workspace = true
ctap-client.workspace = true
ctaphid.workspace = true
ipc.workspace = true
libc.workspace = true
thiserror.workspace = true
hidapi = { version = "2.6", default-features = false, features = ["macos-shared-device", "linux-native"] }
