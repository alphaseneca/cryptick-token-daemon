[package]
name = "daemon"
version.workspace = true
description = "The bridge daemon: owns the radio, hosts the adapters"
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "cryptick-daemon"

[features]
# Swaps the BLE transport for an in-process fake speaking real CTAP. Proves the
# proxy end to end with no radio, on all three OSes. PROJECT.md §14 (L2).
# Pulls in ctap-client purely for its response fixtures, which the fake device
# serves. The daemon itself never parses CBOR (PROJECT.md §8).
fake-transport = ["dep:ctap-client"]

[dependencies]
ble-framing.workspace = true
ctap.workspace = true
ctaphid.workspace = true
ctap-client = { workspace = true, optional = true }
ipc.workspace = true
serde.workspace = true
# The known-devices store (devices.rs) persists its JSON file directly;
# nothing else in this crate needed serde_json before now.
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros", "rt", "net", "io-util"] }
transport-ble = { workspace = true }
vpcd = { workspace = true }

# §15.7's DACL and peer-SID check on the named pipe (`server::windows`).
# Windows-only, and already in the lockfile via tokio — see the workspace
# manifest for the §20 dependency discussion.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util", "io-util", "net"] }
# A faithful software model of the firmware's PIV applet (PROJECT.md §14's
# "needs real hardware to confirm" gap for the vpcd/PIV relay). Test-only: it
# is not `piv`, and this does not relax the no-`piv`-in-`daemon` rule that
# crates/daemon/tests/relay_stays_opaque.rs enforces.
vpicc-piv.workspace = true

# `tests/windows_pipe.rs` reads the live pipe's DACL back out of the kernel
# and asserts Everyone is absent from it. Same crate and version as the
# `cfg(windows)` dependency above; nothing new enters the lockfile.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
] }

[[bin]]
name = "cryptick-daemon"
path = "src/main.rs"

