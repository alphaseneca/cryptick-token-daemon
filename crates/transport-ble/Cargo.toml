[package]
name = "transport-ble"
version.workspace = true
description = "The BLE radio: scanning, bonding verification, and the CTAP fragment transport"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ble-probe"
path = "src/bin/probe.rs"

[[bin]]
name = "ble-ctap"
path = "src/bin/ctap.rs"

[dependencies]
ble-framing.workspace = true
btleplug.workspace = true
futures.workspace = true
thiserror.workspace = true
uuid.workspace = true
ctap.workspace = true
ctap-client.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
