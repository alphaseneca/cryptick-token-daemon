[package]
name = "tickctl"
version.workspace = true
description = "Comprehensive Hardware Token Manager and OATH suite for Cryptick Token"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "tickctl"
path = "src/lib.rs"

[[bin]]
name = "tickctl"
path = "src/main.rs"

[dependencies]
ctap.workspace = true
ctap-client.workspace = true
ctaphid.workspace = true
ipc.workspace = true
thiserror.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
piv.workspace = true
hidapi = { version = "2.6", default-features = false, features = ["macos-shared-device", "linux-native"] }

[dev-dependencies]
proptest.workspace = true
