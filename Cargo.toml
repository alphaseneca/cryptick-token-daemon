[workspace]
resolver = "2"
members = ["crates/ble-framing", "crates/ipc", "crates/ctap", "crates/ctaphid", "crates/daemon"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/alphaseneca/cryptick-token-daemon"

# Runtime dependencies are declared here so the `deny` CI job can check pinning
# from a single file. See PROJECT.md §7 — `webauthn-authenticator-rs` and the
# `soft-fido2*` crates must be pinned exactly when they are added.
[workspace.dependencies]
thiserror = "2"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = "1"
async-trait = "0.1"

# Local crates
ble-framing = { path = "crates/ble-framing" }
ctap = { path = "crates/ctap" }
ctaphid = { path = "crates/ctaphid" }
ipc = { path = "crates/ipc" }
