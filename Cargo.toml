[workspace]
resolver = "2"
members = [
    "crates/ble-framing",
    "crates/ipc",
    "crates/ctap",
    "crates/ctaphid",
    "crates/ctap-client",
    "crates/daemon",
    "crates/transport-ble",
    "crates/sk-middleware",
    "crates/piv",
    "crates/vpcd",
    "crates/vpicc-piv",
    "crates/webauthn-host",
    "crates/token-manager",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/alphaseneca/cryptick-token-daemon"

# Runtime dependencies are declared here so the `deny` CI job can check pinning
# from a single file. See PROJECT.md §7 — `webauthn-authenticator-rs` and the
# `soft-fido2*` crates must be pinned exactly when they are added.
[workspace.dependencies]
thiserror = "2"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = "1"
async-trait = "0.1"
libc = "0.2"
# SHA-256 for the clientDataHash. RustCrypto rather than hand-rolled: the SK
# API requires the challenge be hashed, and a hand-written hash in an
# authenticator path is a worse trade than the supply-chain cost (PROJECT.md §20).
sha2 = "0.10"
# The BLE radio. Exposes no pairing, bonding or MTU API — see §15.2; those are
# platform backends we write ourselves, not something this provides.
btleplug = "0.13"
futures = "0.3"
uuid = "1"
# New as of the credential-management work (PROJECT.md §20 — flagged for
# discussion, not a quiet addition). `ctap-client` needs CTAP2.0 PIN Protocol
# One's ECDH P-256 key agreement to obtain a pinUvAuthToken; nothing already
# in this tree provides elliptic-curve math (confirmed by inspection of
# Cargo.lock before adding this — btleplug's bonding is handled by the OS
# Bluetooth stack, not a Rust crypto crate, so there was nothing to reuse).
# Pinned exactly, matching §7's rule for security-sensitive new surface.
# RustCrypto's `p256`, widely used and audited-by-usage, not a from-scratch
# implementation.
p256 = { version = "=0.13.2", features = ["ecdh"] }
# AES-256 raw block operations for the same PIN protocol (the device encrypts
# pinHashEnc/pinUvAuthToken under AES-256-CBC with a zero IV; see
# `ctap-client/src/pin_protocol.rs`). CBC itself is implemented by hand over
# this crate's block primitive — one or two 16-byte blocks, zero IV, no
# padding — rather than pulling in the `cbc` crate as well, to keep this new
# surface to the minimum that was actually missing.
aes = "=0.8.4"
# HMAC-SHA256 for pinAuth. Already pulled in transitively by `p256`/`ecdsa`
# (RFC 6979 deterministic nonces use it), so depending on it directly adds no
# new supply-chain surface — it's the same crate already in the lockfile,
# just named instead of hidden, and safer than hand-rolling HMAC a second
# time in this codebase (`crates/token-manager/src/access.rs` already does
# once, for OATH, with its own from-scratch SHA-1/HMAC).
hmac = "=0.12.1"

# Local crates
ble-framing = { path = "crates/ble-framing" }
ctap = { path = "crates/ctap" }
ctap-client = { path = "crates/ctap-client" }
ctaphid = { path = "crates/ctaphid" }
daemon = { path = "crates/daemon" }
ipc = { path = "crates/ipc" }
piv = { path = "crates/piv" }
transport-ble = { path = "crates/transport-ble" }
vpcd = { path = "crates/vpcd" }
vpicc-piv = { path = "crates/vpicc-piv" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = false
