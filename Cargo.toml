[workspace]
resolver = "2"
members = ["crates/ble-framing", "crates/ipc", "crates/ctap", "crates/ctaphid", "crates/ctap-client", "crates/daemon", "crates/transport-ble", "crates/sk-middleware", "crates/piv"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/alphaseneca/cryptick-token-daemon"

# Runtime dependencies are declared here so the `deny` CI job can check pinning
# from a single file. See PROJECT.md §7 — `webauthn-authenticator-rs` and the
# `soft-fido2*` crates must be pinned exactly when they are added.
[workspace.dependencies]
thiserror = "2"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = "1"
async-trait = "0.1"
libc = "0.2"
# SHA-256 for the clientDataHash. RustCrypto rather than hand-rolled: the SK
# API requires the challenge be hashed, and a hand-written hash in an
# authenticator path is a worse trade than the supply-chain cost (PROJECT.md §20).
sha2 = "0.10"
# The BLE radio. Exposes no pairing, bonding or MTU API — see §15.2; those are
# platform backends we write ourselves, not something this provides.
btleplug = "0.13"
futures = "0.3"
uuid = "1"

# Local crates
ble-framing = { path = "crates/ble-framing" }
ctap = { path = "crates/ctap" }
ctap-client = { path = "crates/ctap-client" }
ctaphid = { path = "crates/ctaphid" }
daemon = { path = "crates/daemon" }
ipc = { path = "crates/ipc" }
piv = { path = "crates/piv" }
